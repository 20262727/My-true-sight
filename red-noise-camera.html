<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RED NOISE CAMERA</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block}
  #view.mirror{transform:scaleX(-1)}
  video{display:none}
  .hud{position:fixed;pointer-events:none;letter-spacing:.08em;text-shadow:0 0 6px rgba(255,40,40,.8)}
  #score{top:calc(env(safe-area-inset-top) + 12px);right:16px;font-size:20px;font-variant-numeric:tabular-nums}
  #status{bottom:calc(env(safe-area-inset-bottom) + 14px);left:16px;font-size:13px;opacity:.9}
  #pct{bottom:calc(env(safe-area-inset-bottom) + 14px);right:16px;font-size:13px;opacity:.9}
  #pause{top:calc(env(safe-area-inset-top) + 12px);left:16px;font-size:18px;opacity:.85}
  #btns{position:fixed;top:calc(env(safe-area-inset-top) + 48px);right:12px;display:flex;flex-direction:column;gap:8px}
  #btns button{background:rgba(40,0,0,.55);border:1px solid rgba(255,60,60,.6);color:#fff;border-radius:10px;padding:8px 10px;font-size:13px}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle,#3a0000,#000 70%);z-index:10;text-align:center;padding:24px}
  #start h1{margin:0;font-size:26px;letter-spacing:.15em;color:#ff4040;text-shadow:0 0 18px #f00}
  #start p{margin:0;font-size:14px;opacity:.8;line-height:1.6}
  #go{font-size:18px;padding:14px 34px;border-radius:999px;border:1px solid #ff4040;background:#600;color:#fff;box-shadow:0 0 24px #f00}
  #err{color:#ff8080;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="view"></canvas>

<div class="hud" id="pause">II</div>
<div class="hud" id="score">0000000</div>
<div class="hud" id="status">SCANNING...</div>
<div class="hud" id="pct"></div>
<div id="btns">
  <button id="flip">カメラ切替</button>
  <button id="force">常に赤: OFF</button>
</div>

<div id="start">
  <h1>RED NOISE CAMERA</h1>
  <p>人を検知すると、画面が赤いノイズに染まります。</p>
  <button id="go">スタート</button>
  <div id="err"></div>
</div>

<script type="module">
const TV = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';

const video = document.getElementById('video');
const view = document.getElementById('view');
const ctx = view.getContext('2d');
const $ = id => document.getElementById(id);

// 小さい作業用キャンバス（ノイズ生成用）
const SW = 300;
let SH = 400;
const small = document.createElement('canvas');
const sctx = small.getContext('2d', { willReadFrequently: true });
const glow = document.createElement('canvas');
const gctx = glow.getContext('2d');

let segmenter = null;
let facing = 'user';
let stream = null;
let mask = null, mw = 0, mh = 0;      // 最新の人物マスク
let lastMaskSum = 0;
let t = 0;                            // 赤モードの強さ 0..1
let score = 0;
let detectFrames = 0, loseFrames = 0, detected = false;
let force = false;
let activity = 0;
let lastTs = -1;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.width = Math.round(innerWidth * dpr);
  view.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', resize);
resize();

async function startCamera() {
  if (stream) stream.getTracks().forEach(tr => tr.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  view.classList.toggle('mirror', facing === 'user');
}

async function init() {
  $('err').textContent = '';
  $('go').textContent = '読み込み中...';
  $('go').disabled = true;
  try {
    await startCamera();
  } catch (e) {
    $('err').textContent = 'カメラを起動できませんでした。\nhttps のページで開き、カメラを許可してください。\n(' + e.name + ')';
    $('go').textContent = 'スタート'; $('go').disabled = false;
    return;
  }
  try {
    const { FilesetResolver, ImageSegmenter } = await import(TV + '/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks(TV + '/wasm');
    const opts = d => ({
      baseOptions: { modelAssetPath: MODEL, delegate: d },
      runningMode: 'VIDEO',
      outputConfidenceMasks: true,
      outputCategoryMask: false
    });
    try { segmenter = await ImageSegmenter.createFromOptions(fs, opts('GPU')); }
    catch { segmenter = await ImageSegmenter.createFromOptions(fs, opts('CPU')); }
  } catch (e) {
    $('err').textContent = '人物検知モデルを読み込めませんでした（ネット接続を確認）。\n' + e.message;
    $('go').textContent = 'スタート'; $('go').disabled = false;
    return;
  }
  $('start').style.display = 'none';
  requestAnimationFrame(loop);
}

$('go').onclick = init;
$('flip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  try { await startCamera(); } catch {}
};
$('force').onclick = () => {
  force = !force;
  $('force').textContent = '常に赤: ' + (force ? 'ON' : 'OFF');
};

function segment(now) {
  if (!segmenter || video.readyState < 2) return;
  const ts = Math.max(now, lastTs + 1);
  lastTs = ts;
  segmenter.segmentForVideo(video, ts, res => {
    const m = res.confidenceMasks && res.confidenceMasks[0];
    if (!m) return;
    mw = m.width; mh = m.height;
    const arr = m.getAsFloat32Array();
    if (!mask || mask.length !== arr.length) mask = new Float32Array(arr.length);
    mask.set(arr);
  });
}

function updateDetection() {
  if (!mask) return 0;
  let on = 0, sum = 0;
  const step = 4;
  for (let i = 0; i < mask.length; i += step) {
    const v = mask[i];
    sum += v;
    if (v > 0.5) on++;
  }
  const frac = on / (mask.length / step);
  // 動きの量（マスクの変化）→ 波形の揺れに使う
  const diff = Math.abs(sum - lastMaskSum) / (mask.length / step);
  lastMaskSum = sum;
  activity += (Math.min(diff * 40, 1) - activity) * 0.2;

  if (frac > 0.02) { detectFrames++; loseFrames = 0; }
  else { loseFrames++; detectFrames = 0; }
  if (!detected && detectFrames > 3) detected = true;
  if (detected && loseFrames > 15) detected = false;
  return frac;
}

function renderNoise(time) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const nh = Math.round(SW * vh / vw);
  if (nh !== SH || small.width !== SW) {
    SH = nh; small.width = SW; small.height = SH;
    glow.width = Math.round(SW / 6); glow.height = Math.round(SH / 6);
  }
  sctx.drawImage(video, 0, 0, SW, SH);
  const img = sctx.getImageData(0, 0, SW, SH);
  const d = img.data;
  const cx = SW / 2, cy = SH / 2, maxR = Math.hypot(cx, cy);
  const flick = 0.85 + Math.random() * 0.3;

  for (let y = 0; y < SH; y++) {
    const my = mask ? Math.min(mh - 1, (y * mh / SH) | 0) : 0;
    for (let x = 0; x < SW; x++) {
      const i = (y * SW + x) * 4;
      const lum = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) / 255;
      const m = mask ? mask[my * mw + Math.min(mw - 1, (x * mw / SW) | 0)] : 0;
      const n = Math.random();
      const r = Math.hypot(x - cx, y - cy) / maxR;

      // 背景：暗い赤のザラザラしたノイズ + 中央がぼんやり明るい
      let R = (18 + n * 70 * (1 - r * 0.7) + lum * 40) * flick;
      let G = n * 6, B = n * 6;
      if (n > 0.997) { R = 255; G = 120; B = 110; }   // 火花のような粒

      // 人物：明るく光る赤いノイズ
      if (m > 0.05) {
        const core = Math.pow(m, 1.5);
        const pr = 140 + 115 * (0.35 + 0.65 * lum) * (0.55 + 0.45 * n);
        const hot = Math.max(0, pr - 215) * 3 * core * (n > 0.4 ? 1 : 0.3);
        R = R * (1 - core) + pr * core * flick;
        G = G * (1 - core) + hot * 0.9;
        B = B * (1 - core) + hot * 0.8;
      }
      d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = 255;
    }
  }
  sctx.putImageData(img, 0, 0);
  gctx.drawImage(small, 0, 0, glow.width, glow.height);
}

function coverRect(sw, sh, dw, dh) {
  const s = Math.max(dw / sw, dh / sh);
  const w = sw * s, h = sh * s;
  return [(dw - w) / 2, (dh - h) / 2, w, h];
}

function drawWave(yBase, dir, amp, time) {
  const W = view.width;
  const seg = 120;
  ctx.beginPath();
  for (let k = 0; k <= seg; k++) {
    const x = (k / seg) * W;
    const j = Math.sin(k * 0.9 + time * 0.012) * 0.4 + (Math.random() - 0.5) * 1.6;
    const y = yBase + dir * Math.abs(j) * amp;
    k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function loop(now) {
  segment(now);
  const frac = updateDetection();
  const target = (detected || force) ? 1 : 0;
  t += (target - t) * (target ? 0.12 : 0.05);

  const W = view.width, H = view.height;
  const vw = video.videoWidth, vh = video.videoHeight;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (vw) {
    const [x, y, w, h] = coverRect(vw, vh, W, H);

    // 通常のカメラ映像
    if (t < 0.999) {
      ctx.globalAlpha = 1;
      ctx.drawImage(video, x, y, w, h);
    }

    if (t > 0.001) {
      renderNoise(now);
      // 赤ノイズ層
      ctx.globalAlpha = t;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(small, x, y, w, h);
      // 光のにじみ（グロー）
      ctx.imageSmoothingEnabled = true;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = t * 0.55;
      ctx.drawImage(glow, x, y, w, h);
      ctx.globalAlpha = t * 0.3;
      ctx.drawImage(glow, x - w * 0.03, y - h * 0.03, w * 1.06, h * 1.06);
      ctx.globalCompositeOperation = 'source-over';

      // 周辺減光
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.hypot(W, H) * 0.6);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.85)');
      ctx.globalAlpha = t;
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // 上下の赤い波形ライン
      const amp = (8 + activity * 60 + Math.random() * 6) * (W / 800 + 0.4);
      ctx.globalAlpha = t;
      ctx.strokeStyle = 'rgba(255,70,70,0.95)';
      ctx.lineWidth = Math.max(1.5, W / 600);
      ctx.shadowColor = '#ff2020';
      ctx.shadowBlur = 14;
      drawWave(H * 0.1, -1, amp, now);
      drawWave(H * 0.9, 1, amp, now);
      ctx.strokeStyle = 'rgba(255,120,120,0.5)';
      ctx.lineWidth = Math.max(1, W / 1200);
      drawWave(H * 0.1 + 4, -1, amp * 0.6, now + 500);
      drawWave(H * 0.9 - 4, 1, amp * 0.6, now + 500);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }

  if (t > 0.5) score += Math.round(37 + activity * 900);
  $('score').textContent = String(score % 10000000).padStart(7, '0');
  $('status').textContent = detected ? 'PERSON DETECTED' : (force ? 'RED MODE' : 'SCANNING...');
  $('status').style.color = detected ? '#ff6060' : '#fff';
  $('pct').textContent = mask ? 'BODY ' + Math.round(frac * 100) + '%' : '';

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
